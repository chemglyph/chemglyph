name: Release

# Publishes to PyPI when a version tag (v0.1.3, ...) is pushed. Uses PyPI
# trusted publishing, so no upload token is stored anywhere. The PyPI project
# must list this repository, this workflow file, and the "pypi" environment
# as a trusted publisher.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check that the tag matches every version field
        run: |
          python - <<'PY'
          import json, os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/chemglyph/__init__.py").read())[1]
          server = json.load(open("server.json"))
          found = {
              "tag": tag.removeprefix("v"),
              "pyproject": version,
              "__init__": init,
              "server.json": server["version"],
              "server.json package": server["packages"][0]["version"],
          }
          print(found)
          if len(set(found.values())) != 1:
              sys.exit("version mismatch")
          PY

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
